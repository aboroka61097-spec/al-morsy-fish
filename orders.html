<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075985">
<title>طلب أوردر | المرسي للأسماك</title>

<style>
:root{
  font-family:Tahoma,Arial,sans-serif;
  color:#123047;
  background:#f2f8fb
}
*{box-sizing:border-box}
body{
  margin:0;padding:14px;
  background:linear-gradient(160deg,#e0f2fe,#f8fafc 55%,#dbeafe);
  min-height:100vh
}
main{max-width:700px;margin:auto}
.card{
  background:#fff;border:1px solid #dbeafe;
  border-radius:20px;padding:20px;
  box-shadow:0 10px 30px #0c4a6e12
}
.brand{text-align:center;color:#075985}
.brand h1{font-size:24px;margin:8px 0}
.brand p{margin:6px 0 18px;color:#456579}
label{display:block;font-weight:bold;margin:14px 0 7px}
input,textarea,select{
  width:100%;font:inherit;padding:12px;
  border:1px solid #cbd5e1;border-radius:10px;
  background:#fff
}
textarea{min-height:75px;resize:vertical}
button{
  width:100%;border:0;border-radius:11px;
  padding:13px;font:inherit;font-weight:bold;
  cursor:pointer;margin-top:12px;
  background:#075985;color:white
}
button:disabled{opacity:.6}
.section{
  margin-top:20px;padding:14px;
  border:1px solid #dbeafe;border-radius:14px;
  background:#f8fcff
}
.section h2{font-size:18px;margin:0 0 10px;color:#075985}
.item{
  background:#fff;border:1px solid #e2e8f0;
  border-radius:11px;padding:12px;margin:9px 0
}
.item-head{
  display:flex;justify-content:space-between;
  align-items:center;gap:10px;flex-wrap:wrap
}
.item-name{font-weight:bold}
.price{color:#0369a1;font-size:14px;margin-top:5px}
.qty-row{
  display:grid;grid-template-columns:1fr 110px;
  align-items:center;gap:10px;margin-top:10px
}
.qty-row label{margin:0;font-size:14px}
.qty-row input{padding:9px}
.check-row{
  display:flex;align-items:center;gap:9px;
  font-weight:normal;margin:8px 0
}
.check-row input{width:20px;height:20px;flex-shrink:0}
.check-row label{margin:0;font-weight:normal}
.muted{font-size:13px;color:#64748b;line-height:1.8}
.total-box{
  background:#ecfdf5;border:1px solid #a7f3d0;
  border-radius:13px;padding:15px;margin-top:18px
}
.total-line{
  display:flex;justify-content:space-between;
  gap:10px;margin:9px 0
}
.grand-total{
  font-size:21px;font-weight:bold;
  border-top:1px solid #a7f3d0;padding-top:12px
}
.status{
  display:none;margin-top:15px;padding:12px;
  border-radius:10px;line-height:1.9;
  white-space:pre-line;overflow-wrap:anywhere
}
.ok{display:block;background:#dcfce7;color:#166534}
.err{display:block;background:#fee2e2;color:#991b1b}
.contact{text-align:center;margin-top:16px;color:#456579;font-size:14px}
.empty{padding:10px;color:#64748b;text-align:center}
@media(max-width:420px){
  .card{padding:14px}
  .qty-row{grid-template-columns:1fr 90px}
}
</style>
</head>

<body>
<main>
<section class="card">

<header class="brand">
<h1>🐟 طلب أوردر من المرسي للأسماك</h1>
<p>من البحر لحد عندك ❤️</p>
</header>

<form id="orderForm">

<label for="customerName">الاسم بالكامل
