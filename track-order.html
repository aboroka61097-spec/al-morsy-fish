<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071D3A">
<title>متابعة الطلب | المرسي للأسماك</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f1f5f9;color:#172b4d}
.wrap{max-width:560px;margin:30px auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 28px #102a4312}
h1{margin:0 0 10px;color:#075985;font-size:25px}
p{line-height:1.8;color:#52647a}
label{display:block;margin:20px 0 8px;font-weight:bold}
input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#075985;color:white;font-size:17px;font-weight:bold;margin-top:14px;cursor:pointer}
button:disabled{opacity:.6}
.result{display:none;margin-top:20px;padding:16px;background:#f0f9ff;border-radius:12px}
.status{font-size:21px;font-weight:bold;color:#075985}
.small{font-size:13px;color:#64748b;overflow-wrap:anywhere}
a{color:#075985}
.message{display:none;margin-top:16px;padding:12px;border-radius:10px;line-height:1.8;white-space:pre-line;overflow-wrap:anywhere}
.error{display:block;background:#fee2e2;color:#991b1b}
.success{display:block;background:#dcfce7;color:#166534}
</style>
</head>
<body>
<div class="wrap">
<main class="card">
<h1>🐟 متابعة طلبك</h1>
<p>المرسي للأسماك — من البحر لحد عندك</p>
<p>اكتب رقم الطلب لمتابعة حالته. استخدم نفس المتصفح الذي أرسلت منه الطلب.</p>

<form id="trackForm">
<label for="orderId">رقم الطلب</label>
<input id="orderId" autocomplete="off" placeholder="الصق رقم الطلب هنا" required>
<button id="trackBtn" type="submit">متابعة الطلب</button>
</form>

<div id="message" class="message" role="status" aria-live="polite"></div>

<section id="result" class="result">
<h2>تفاصيل المتابعة</h2>
<p>رقم الطلب:</p>
<div id="shownId" class="small"></div>
<p>حالة الطلب:</p>
<div id="status" class="status">جارٍ التحميل...</div>
<p id="updated"></p>
</section>

<p class="small">متابعة الطلب متاحة لصاحب الطلب فقط.</p>
<p><a href="./orders.html">الرجوع لصفحة طلب السمك</a></p>
</main>
</div>

<script type="module">
import {
  initializeApp,
  getApps
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

import {
  getAuth,
  signInAnonymously,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCviWU0LzDbUn8M7ETIXORu_KnTSgnwjhc",
  authDomain: "al-morsy-fish.firebaseapp.com",
  projectId: "al-morsy-fish",
  storageBucket: "al-morsy-fish.firebasestorage.app",
  messagingSenderId: "826154741509",
  appId: "1:826154741509:web:9cb852e4a7bbe5aaacd16c"
};

/* مهم: نفس اسم تطبيق العميل المستخدم في orders.html */
const appName = "customerApp";
const existingApp = getApps().find(item => item.name === appName);
const app = existingApp || initializeApp(firebaseConfig, appName);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const form = $("trackForm");
const orderInput = $("orderId");
const button = $("trackBtn");
const message = $("message");
const result = $("result");
const shownId = $("shownId");
const statusBox = $("status");
const updated = $("updated");

let unsubscribe = null;

const labels = {
  new: "تم استلام الطلب",
  contacted: "تم التواصل مع العميل",
  confirmed: "تم تأكيد الطلب",
  preparing: "جاري تجهيز الطلب",
  ready: "الطلب جاهز",
  out_for_delivery: "الطلب خرج للتوصيل",
  delivered: "تم تسليم الطلب",
  completed: "تم تسليم الطلب",
  cancelled: "تم إلغاء الطلب"
};

function showMessage(text, type = "success") {
  message.className = "message " + type;
  message.textContent = text;
}

function errorDetails(error) {
  return "كود الخطأ: " + (error?.code || "unknown") +
    "\nالتفاصيل: " + (error?.message || "لا توجد تفاصيل إضافية");
}

async function ensureLogin() {
  await setPersistence(auth, browserLocalPersistence);

  if (auth.currentUser) {
    return auth.currentUser;
  }

  const credential = await signInAnonymously(auth);
  return credential.user;
}

function stopListening() {
  if (unsubscribe) {
    unsubscribe();
    unsubscribe = null;
  }
}

function renderStatus(order) {
  statusBox.textContent =
    labels[order.status] ||
    ("حالة الطلب: " + (order.status || "قيد المراجعة"));

  updated.textContent =
    "الحالة تتحدث تلقائيًا عند تعديلها من إدارة المرسي للأسماك.";
}

async function trackOrder(orderId) {
  stopListening();
  result.style.display = "none";
  updated.textContent = "";
  button.disabled = true;
  showMessage("جارٍ التحقق من الطلب...");

  try {
    const user = await ensureLogin();
    const orderRef = doc(db, "orders", orderId);

    let snap;

    try {
      snap = await getDoc(orderRef);
    } catch (error) {
      if (error?.code === "permission-denied") {
        showMessage(
          "Firebase رفض قراءة الطلب بسبب الصلاحيات.\n\n" +
          "تأكد أن صفحة orders.html تستخدم تطبيق Firebase باسم customerApp أيضًا.\n" +
          "إذا أُنشئ هذا الطلب قبل توحيد الهوية، فقد لا تستطيع الهوية الحالية قراءته.\n\n" +
          "لا تغيّر قواعد Firestore ولا تجعل قراءة الطلبات عامة.",
          "error"
        );
        return;
      }
      throw error;
    }

    if (!snap.exists()) {
      showMessage("الطلب غير موجود. راجع رقم الطلب.", "error");
      return;
    }

    const order = snap.data();

    if (!order.ownerUid || order.ownerUid !== user.uid) {
      showMessage(
        "الطلب مسجل بهوية عميل مختلفة عن الهوية الحالية.\n" +
        "جرّب طلبًا جديدًا بعد توحيد تطبيق العميل في صفحة الطلب والمتابعة.",
        "error"
      );
      return;
    }

    shownId.textContent = orderId;
    result.style.display = "block";
    renderStatus(order);
    showMessage("تم العثور على طلبك بنجاح.", "success");

    unsubscribe = onSnapshot(
      orderRef,
      liveSnap => {
        if (!liveSnap.exists()) {
          result.style.display = "none";
          showMessage("لم يعد الطلب متاحًا.", "error");
          stopListening();
          return;
        }

        const liveOrder = liveSnap.data();

        if (liveOrder.ownerUid !== user.uid) {
          result.style.display = "none";
          showMessage("تعذر التحقق من ملكية الطلب.", "error");
          stopListening();
          return;
        }

        renderStatus(liveOrder);
      },
      error => {
        console.error("Tracking listener error:", error);
        showMessage(
          "تعذر تحديث حالة الطلب.\n" + errorDetails(error),
          "error"
        );
      }
    );

  } catch (error) {
    console.error("Tracking error:", error);

    if (error?.code === "auth/operation-not-allowed") {
      showMessage(
        "تسجيل الدخول المجهول غير مفعّل في Firebase Authentication.",
        "error"
      );
    } else if (error?.code === "auth/network-request-failed") {
      showMessage("تعذر الاتصال بالإنترنت. حاول مرة أخرى.", "error");
    } else {
      showMessage("تعذر فتح الطلب.\n" + errorDetails(error), "error");
    }
  } finally {
    button.disabled = false;
  }
}

form.addEventListener("submit", async event => {
  event.preventDefault();

  const id = orderInput.value.trim();

  if (!id || id.length > 150 || id.includes("/")) {
    showMessage("اكتب رقم الطلب بشكل صحيح.", "error");
    return;
  }

  await trackOrder(id);
});

const params = new URLSearchParams(location.search);
let savedId = "";

try {
  savedId = localStorage.getItem("alMorsyLastOrderId") || "";
} catch (error) {
  console.warn("Local storage unavailable:", error);
}

const initialId = (params.get("id") || "").trim() || savedId.trim();

if (initialId) {
  orderInput.value = initialId;
  trackOrder(initialId);
}
</script>
</body>
</html>
