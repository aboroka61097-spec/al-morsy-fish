<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075985">
<title>طلب أوردر | المرسي للأسماك</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#123047;background:#f2f8fb}
*{box-sizing:border-box}body{margin:0;padding:16px;background:linear-gradient(160deg,#e0f2fe,#f8fafc 55%,#dbeafe);min-height:100vh}
main{max-width:650px;margin:0 auto}.card{background:#fff;border:1px solid #dbeafe;border-radius:20px;padding:22px;box-shadow:0 10px 30px #0c4a6e12}
.brand{text-align:center;color:#075985}.brand img{width:92px;height:92px;object-fit:contain}.brand h1{font-size:25px;margin:8px 0}.brand p{margin:6px 0 18px;color:#456579}
label{display:block;font-weight:bold;margin:15px 0 7px}input,textarea,select{width:100%;font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}textarea{min-height:85px;resize:vertical}
button{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:bold;cursor:pointer;margin-top:18px;background:#075985;color:#fff}button:disabled{opacity:.6}
.note{font-size:13px;color:#64748b;line-height:1.8}.status{display:none;margin-top:15px;padding:12px;border-radius:10px;line-height:1.7}.ok{display:block;background:#dcfce7;color:#166534}.err{display:block;background:#fee2e2;color:#991b1b}
.contact{text-align:center;margin:16px 0 0;color:#456579;font-size:14px}
</style>
</head>
<body>
<main>
<section class="card">
<header class="brand">
<img src="file_0000000013708210867485e3523c3f02.png" alt="شعار المرسي للأسماك" onerror="this.style.display='none'">
<h1>🐟 طلب أوردر من المرسي للأسماك</h1>
<p>من البحر لحد عندك ❤️</p>
</header>
<form id="orderForm">
<label for="customerName">الاسم بالكامل *</label>
<input id="customerName" name="customerName" autocomplete="name" required maxlength="100" placeholder="اكتب اسمك">

<label for="phone">رقم الموبايل *</label>
<input id="phone" name="phone" inputmode="tel" autocomplete="tel" required maxlength="20" placeholder="رقم نقدر نتواصل معاك عليه">

<label for="address">عنوان التوصيل بالتفصيل *</label>
<textarea id="address" name="address" autocomplete="street-address" required maxlength="500" placeholder="المنطقة والشارع وأقرب علامة مميزة"></textarea>

<label for="items">الأصناف والكميات المطلوبة *</label>
<textarea id="items" name="items" required maxlength="1500" placeholder="مثال: ٢ كيلو شبار وسط، كيلو جمبري..."></textarea>

<label for="delivery">طريقة الاستلام</label>
<select id="delivery" name="delivery">
<option value="delivery">توصيل لحد باب البيت</option>
<option value="pickup">استلام من المحل</option>
</select>

<label for="notes">ملاحظات إضافية (اختياري)</label>
<textarea id="notes" name="notes" maxlength="1000" placeholder="طريقة التجهيز أو أي ملاحظات"></textarea>

<p class="note">إرسال الطلب لا يعني تأكيد السعر أو التوافر؛ فريق المرسي هيتواصل معاك لتأكيد التفاصيل.</p>
<button id="submitBtn" type="submit">إرسال الطلب</button>
<div id="status" class="status" role="status" aria-live="polite"></div>
</form>
<div class="contact">المرسي للأسماك — الإسماعيلية، طريق البلاجات، سوق السمك</div>
</section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCviWU0LzDbUn8M7ETIXORu_KnTSgnwjhc",
  authDomain: "al-morsy-fish.firebaseapp.com",
  projectId: "al-morsy-fish",
  storageBucket: "al-morsy-fish.firebasestorage.app",
  messagingSenderId: "826154741509",
  appId: "1:826154741509:web:9cb852e4a7bbe5aaacd16c"
};

const form = document.getElementById("orderForm");
const btn = document.getElementById("submitBtn");
const statusBox = document.getElementById("status");
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  statusBox.className = "status";
  statusBox.textContent = "";
  btn.disabled = true;
  btn.textContent = "جارٍ إرسال الطلب...";
  const data = new FormData(form);
  const phone = String(data.get("phone") || "").trim();
  const items = String(data.get("items") || "").trim();

  if (phone.replace(/\D/g, "").length < 8 || !items) {
    statusBox.className = "status err";
    statusBox.textContent = "من فضلك راجع رقم الموبايل والأصناف المطلوبة.";
    btn.disabled = false;
    btn.textContent = "إرسال الطلب";
    return;
  }

  try {
    const docRef = await addDoc(collection(db, "orders"), {
      customerName: String(data.get("customerName")).trim(),
      phone,
      address: String(data.get("address")).trim(),
      items,
      delivery: String(data.get("delivery")),
      notes: String(data.get("notes") || "").trim(),
      status: "new",
      source: "website",
      createdAt: serverTimestamp()
    });
    statusBox.className = "status ok";
    statusBox.textContent = "تم تسجيل طلبك بنجاح. رقم الطلب: " + docRef.id + " — فريق المرسي هيتواصل معاك للتأكيد.";
    form.reset();
  } catch (error) {
    console.error("Order submission failed:", error);
    statusBox.className = "status err";
    if (error && (error.code === "permission-denied" || error.code === "firestore/permission-denied")) {
      statusBox.textContent = "نموذج الطلب جاهز، لكن حفظ الطلبات لم يُفعّل بعد في قاعدة البيانات. من فضلك تواصل مع المحل مباشرة لحين إكمال الإعداد.";
    } else {
      statusBox.textContent = "حصلت مشكلة أثناء إرسال الطلب. من فضلك جرّب مرة أخرى أو تواصل مع المحل مباشرة.";
    }
  } finally {
    btn.disabled = false;
    btn.textContent = "إرسال الطلب";
  }
});
</script>
</body>
</html>
